name: euraka
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  loading_animation_widget: ^1.3.0
  go_router: 17.5.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  flutter_svg: ^2.3.0
  lottie: ^3.6.1
  device_preview: ^1.3.1
  animate_do: ^5.1.0
  cached_network_image: ^3.4.1
  get_it: ^8.0.3
  flutter_dotenv: ^5.2.1
  skeletonizer: ^3.0.0
  toastification: ^3.0.3
  equatable: ^3.0.0
  pretty_dio_logger: ^1.4.0
  dartz: ^0.10.1
  image_picker: ^1.2.4
  file_picker: ^13.3.3
  video_player: ^2.14.1
  chewie: ^1.17.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
